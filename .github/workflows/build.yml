name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (VST3 + AU, universal)
    # macos-14 = Apple Silicon 托管机，排队远快于 Intel 的 macos-13；
    # Xcode 交叉编译两个架构切片，产物仍是通用二进制。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Steinberg VST3 SDK (with submodules)
        run: |
          if [ ! -f vst3sdk/pluginterfaces/vst/ivstaudioprocessor.h ]; then
            rm -rf vst3sdk
            git clone --depth 1 --recursive --branch v3.7.4_build_25 \
              https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          fi
          if [ -f vst3sdk/pluginterfaces/vst/ivstaudioprocessor.h ]; then
            echo "SDK OK: vst3 headers present"
          else
            echo "SDK BROKEN:"; ls vst3sdk/pluginterfaces 2>&1 || true
            exit 1
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DJUCE_VST3_SDK_DIR=${{ github.workspace }}/vst3sdk

      - name: Build
        run: cmake --build build --config Release -j 3

      - name: Core DSP test
        run: ctest --test-dir build --output-on-failure

      - name: Ad-hoc sign (local use, no notarization)
        run: |
          codesign --force --deep -s - build/PitchLab_artefacts/Release/VST3/PitchLab.vst3 || true
          codesign --force --deep -s - build/PitchLab_artefacts/Release/AU/PitchLab.component || true

      - name: Package
        run: |
          cd build/PitchLab_artefacts/Release
          zip -r PitchLab-macOS-universal.zip VST3 AU
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: PitchLab-macOS-universal
          path: build/PitchLab_artefacts/Release/PitchLab-macOS-universal.zip

  windows:
    name: Windows (VST3 x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Steinberg VST3 SDK (with submodules)
        shell: pwsh
        run: |
          if (-not (Test-Path 'vst3sdk\pluginterfaces\vst\ivstaudioprocessor.h')) {
            Remove-Item -Recurse -Force vst3sdk -ErrorAction SilentlyContinue
            git clone --depth 1 --recursive --branch v3.7.4_build_25 `
              https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          }
          if (Test-Path 'vst3sdk\pluginterfaces\vst\ivstaudioprocessor.h') {
            Write-Host 'SDK OK: vst3 headers present'
          } else {
            Write-Host 'SDK BROKEN:'
            Get-ChildItem vst3sdk\pluginterfaces -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_VST3_SDK_DIR=${{ github.workspace }}\vst3sdk

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Core DSP test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build\PitchLab_artefacts\Release\VST3 -DestinationPath PitchLab-Windows-x64.zip
          Get-ChildItem -Recurse build\PitchLab_artefacts\Release

      - uses: actions/upload-artifact@v4
        with:
          name: PitchLab-Windows-x64
          path: PitchLab-Windows-x64.zip
